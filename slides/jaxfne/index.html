<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JaxFNE: Spectrolaminar Dynamics · Slides</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png" />
  <style>
    :root {
      --bg: #000; --gold: #cfb87c; --panel: #111; --line: #222; --btn: #1a1a1a; --btn-line: #333;
      --btn-hover: #2a2a2a; --muted: #888; --shadow: rgba(0,0,0,0.9);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--gold);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
      z-index: 10;
    }
    header a { color: var(--gold); text-decoration: none; font-weight: 600; }
    header a:hover { text-decoration: underline; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      background: var(--btn);
      color: var(--gold);
      border: 1px solid var(--btn-line);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn:hover { background: var(--btn-hover); border-color: var(--gold); text-decoration: none; }
    main {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 16px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    img.slide-img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 6px 30px var(--shadow);
      user-select: none;
      -webkit-user-select: none;
    }
    footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
      z-index: 10;
    }
    .footer-center { display: flex; align-items: center; gap: 16px; }
    .hint { font-size: 0.75rem; color: var(--muted); }
    @media (max-width: 600px) {
      .hint { display: none; }
      .nav-btn { min-height: 44px; }
      header, footer { padding: 8px 12px; font-size: 0.8rem; }
      main { padding: 4px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../../lab/">← Return to lab</a>
    <span id="deck-title">JaxFNE: Spectrolaminar Dynamics</span>
    <div class="header-actions">
      <button class="nav-btn" id="fs-btn" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
      <a href="slides.pdf" target="_blank" download class="nav-btn">PDF ↗</a>
    </div>
  </header>
  <main id="slide-container" title="Click to advance (or use ← / → arrows)">
    <img id="current-slide" class="slide-img" src="pages/page-01.png" alt="Slide 1" />
  </main>
  <footer>
    <button class="nav-btn" id="prev-btn">← Prev</button>
    <div class="footer-center">
      <span id="counter">Slide 1 / 14</span>
      <span class="hint">Click or press Space / Arrows to navigate</span>
    </div>
    <button class="nav-btn" id="next-btn">Next →</button>
  </footer>
  <script>
    var total = 14;
    var current = 1;
    var img = document.getElementById('current-slide');
    var counter = document.getElementById('counter');
    function show(n) {
      if (n < 1) n = 1;
      if (n > total) n = total;
      current = n;
      var pad = (current < 10 ? '0' : '') + current;
      img.src = 'pages/page-' + pad + '.png';
      img.alt = 'Slide ' + current;
      counter.textContent = 'Slide ' + current + ' / ' + total;
    }
    document.getElementById('prev-btn').onclick = function(e) { e.stopPropagation(); show(current - 1); };
    document.getElementById('next-btn').onclick = function(e) { e.stopPropagation(); show(current + 1); };
    document.getElementById('slide-container').onclick = function() { show(current + 1); };

    var fsBtn = document.getElementById('fs-btn');
    function toggleFs() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    if (fsBtn) fsBtn.onclick = toggleFs;

    window.onkeydown = function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        show(current + 1);
      }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        show(current - 1);
      }
      if (e.key === 'f' || e.key === 'F') {
        toggleFs();
      }
    };
  </script>
</body>
</html>
